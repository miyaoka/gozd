# リリースワークフロー
# main への push で、直近 tag からの feat / fix（deps scope 除外）があればリリースを自動発行する。
# バージョンは CalVer（vYYYY.M.PATCH、UTC）で自動採番し、Latest として出す
name: release

on:
  push:
    branches:
      - main

# decide job は checkout + git 読みのみで write 不要。release job 側の明示ブロックだけ昇格する
permissions:
  contents: read

# PATCH は既存 tag の max + 1 で採番するため、リリースを直列化して同番号の衝突を構造的に防ぐ。
# cancel はしない（ビルド途中の cancel は tag だけ残る等の中途半端な状態を作るため）
concurrency:
  group: release

jobs:
  # ==============================================================
  # リリース判定と tag 採番（ubuntu で完結する軽量ジョブ）
  # ==============================================================
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          show-progress: false
          # 後続ステップは git push しない（release 作成は gh CLI + GH_TOKEN）ため
          # トークンを git config に残さない
          persist-credentials: false

      - name: Decide release tag
        id: decide
        run: |
          set -euo pipefail

          # 発火判定: 直近の tag から HEAD に feat / fix があるか。
          # renovate は全 commit が scope (deps) を持つため scope 除外で確実に落ちる
          last="$(git describe --tags --abbrev=0 2> /dev/null || true)"
          if [[ -n "${last}" ]]; then
            range="${last}..HEAD"
          else
            range="HEAD"
          fi
          count="$(git log "${range}" --format=%s | grep -E '^(feat|fix)(\([^)]+\))?!?:' | grep -cvE '^(feat|fix)\(deps\)' || true)"
          if [[ "${count}" -eq 0 ]]; then
            echo "no feat/fix commits since ${last:-repository root}; skipping release"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # CalVer: YYYY.M は UTC の年月、PATCH は同じ年月の既存 tag の max + 1（無ければ 0）。
          # 月をゼロ埋めしないのは、semver が先頭ゼロを正規化で消し、tag と焼き込む version が
          # ずれるため
          year_month="$(date -u +%Y.%-m)"
          last_patch="$(git tag -l "v${year_month}.*" | sed "s/^v${year_month}\.//" | sort -n | tail -1)"
          if [[ -n "${last_patch}" ]]; then
            patch=$((last_patch + 1))
          else
            patch=0
          fi
          tag="v${year_month}.${patch}"

          echo "tag=${tag}"
          {
            echo "proceed=true"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  # ==============================================================
  # ビルドと GitHub Release 作成（macOS arm64）
  # ==============================================================
  release:
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          fetch-depth: 0
          show-progress: false
          # 後続ステップは git push しない（release 作成は gh CLI + GH_TOKEN）ため
          # トークンを git config に残さない
          persist-credentials: false

      - uses: $/.github/actions/setup-environment

      # リリースビルドは stable identity（GOZD_BUILD_CHANNEL）で、tag 由来の version を焼き込む
      - name: Build .app
        run: |
          set -euo pipefail
          GOZD_BUILD_CHANNEL=stable GOZD_BUILD_VERSION="${TAG#v}" pnpm --filter @gozd/electron build:app

      # ルートは bin/ + Gozd.app/ の 2 エントリにする。ルートがディレクトリ 1 個だけの
      # tar は mise が strip_components=1 を自動適用して .app バンドルが解体されるため
      - name: Package tarball
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir "${stage}/bin"
          mv "apps/electron/out/mac-arm64/Gozd.app" "${stage}/"
          ln -s ../Gozd.app/Contents/Resources/app/bin/gozd "${stage}/bin/gozd"
          tar -C "${stage}" -czf gozd-macos-arm64.tar.gz bin Gozd.app

      # 署名の代わりの改竄検知。mise は GitHub attestation 検証をデフォルト有効にしている
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: gozd-macos-arm64.tar.gz

      # mise は /releases/latest で最新を解決するため、Latest を明示する
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" --generate-notes --latest --target "${GITHUB_SHA}" gozd-macos-arm64.tar.gz
