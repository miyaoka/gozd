# コードバリデーションワークフロー
name: code_validation
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # コードバリデーション（Matrix実行）
  #
  # PRで差分のあるパッケージとその依存先に限定してチェックする
  # ルート設定ファイル（pnpm-workspace.yaml, mise.toml）が変更された場合は
  # 全ワークスペースを対象にチェックする
  # ==============================================================
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ルートの集約スクリプトは 6 種あるが、matrix は fix を除いた 5 本。自動修正できる
          # 違反で PR を止めず、daily-fix workflow が日次の全件実行で返済する
          # （.github/workflows/daily-fix.yml）
          #
          # diff_command に --include-workspace-root は要らない: 正のフィルタ（`--filter`）を
          # 与えると pnpm は root project を除外しないため、root 直下ファイルの変更でも root は
          # 選択される。逆に full_command 側の `pnpm -r`（*:all）はフィルタが無く root が
          # 除外されるため、そちらでは flag が必須（外すと root の test が静かに走らなくなる）
          - name: typecheck
            diff_command: pnpm --filter '...[origin/${{ github.base_ref }}]' --if-present --no-bail --aggregate-output --reporter=append-only typecheck
            full_command: pnpm run typecheck:all

          - name: lint
            diff_command: pnpm --filter '...[origin/${{ github.base_ref }}]' --if-present --no-bail --aggregate-output --reporter=append-only lint
            full_command: pnpm run lint:all

          - name: test
            diff_command: pnpm --filter '...[origin/${{ github.base_ref }}]' --if-present --no-bail --aggregate-output --reporter=append-only test
            full_command: pnpm run test:all

          # bundler だけが検査できる領域の gate。import 指定子の解決（`?worker` や
          # ambient `declare module` で型付けした deep import は typecheck から不可視で、
          # lint も no-unresolved を持たない）と、pnpm patch が named export を実際に
          # 復元できているか（Rolldown は ESM の欠落 named export を error にする）は
          # bundle しない限り分からない。これが無いと配布物が壊れる変更が全 job 緑で
          # 通り、merge 後の release build が最初の検知点になる
          - name: build
            diff_command: pnpm --filter '...[origin/${{ github.base_ref }}]' --if-present --no-bail --aggregate-output --reporter=append-only build
            full_command: pnpm run build:all

          # knip は repo 全体を 1 単位で解析するため差分フィルタが無く、両モード同一。
          # pre-commit hook (--fix 付き) だけでは --no-verify で素通りするため gate を置く
          # （CI 側は --fix なしで検査のみ）
          - name: knip
            diff_command: pnpm run knip
            full_command: pnpm run knip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: blob:none
          fetch-depth: 0
          show-progress: false

      - uses: ./.github/actions/setup-environment

      # ルート設定ファイルの変更を検出
      # pnpm-workspace.yaml: catalog でバージョン管理、各 package.json は catalog: 参照のため差分が出ない
      # mise.toml: Node.js/pnpm/Bun バージョン
      # package.json: 集約スクリプト（*:all）の定義元。root には build / typecheck の script が
      # 無く差分モードでは --if-present で素通りするため、ここを触った PR は full_command に
      # 切り替えないと集約スクリプト自身の破損を検出できない（glob に ** を付けないので
      # apps/*/package.json は対象外。そちらは差分フィルタが当該パッケージを選ぶ）
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: root-config
        with:
          files: |
            package.json
            pnpm-workspace.yaml
            mise.toml

      # ルート設定ファイルが変更された場合は全体チェック、それ以外は差分フィルタ
      - name: Run ${{ matrix.name }}
        run: |
          if [[ "${{ steps.root-config.outputs.any_changed }}" == "true" ]]; then
            echo "ルート設定ファイルが変更されたため、全ワークスペースをチェックします"
            ${{ matrix.full_command }}
          else
            ${{ matrix.diff_command }}
          fi

  # ==============================================================
  # CI全体のステータス集約
  # Branch Protectionルールでこのジョブのみを必須チェックに設定
  # これにより内部のジョブ構成を自由に変更可能
  # ==============================================================
  all-green:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validation
    steps:
      - name: Check all CI jobs status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: validation
