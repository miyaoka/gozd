# ** が0階層以上にマッチするようにする（デフォルトは1階層以上）
glob_matcher: doublestar

output:
  - execution_out

pre-commit:
  piped: true
  jobs:
    # typecheck / test / lint+fix を並列実行
    - name: checks-and-fixes
      group:
        parallel: true
        jobs:
          - name: typecheck-shared
            root: "packages/shared/"
            glob: "**/*.ts"
            run: pnpm run typecheck
          - name: typecheck-claude-session-log
            root: "packages/claude-session-log/"
            glob: "**/*.ts"
            run: pnpm run typecheck
          - name: typecheck-renderer
            root: "apps/renderer/"
            glob: "**/*.{ts,vue}"
            run: pnpm run typecheck
          - name: typecheck-electron
            root: "apps/electron/"
            glob: "**/*.ts"
            run: pnpm run typecheck
          - name: test-shared
            root: "packages/shared/"
            glob: "**/*.ts"
            run: bun test
          - name: test-claude-session-log
            root: "packages/claude-session-log/"
            glob: "**/*.ts"
            run: bun test
          - name: test-renderer
            root: "apps/renderer/"
            glob: "**/*.ts"
            run: bun test
          - name: test-electron
            root: "apps/electron/"
            glob: "**/*.ts"
            run: bun test

          # Formatter（ts/vue 以外。ts/vue は各 linter ジョブで oxfmt を実行）
          - name: oxfmt
            glob: "**/*.{css,md}"
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true

          # Linter + Formatter
          - name: oxlint-root
            glob: "*.ts"
            exclude:
              - "apps/**"
              - "packages/**"
            run: pnpm exec oxlint --type-aware --fix {staged_files} && pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxlint-shared
            root: "packages/shared/"
            glob: "**/*.ts"
            run: pnpm exec oxlint --type-aware --fix {staged_files} && pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxlint-claude-session-log
            root: "packages/claude-session-log/"
            glob: "**/*.ts"
            run: pnpm exec oxlint --type-aware --fix {staged_files} && pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxlint-electron
            root: "apps/electron/"
            glob: "**/*.ts"
            run: pnpm exec oxlint --type-aware --fix {staged_files} && pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: typecheck-themes
            root: "packages/themes/"
            glob: "{src,scripts}/**/*.ts"
            run: pnpm run typecheck
          - name: oxlint-themes
            root: "packages/themes/"
            glob: "{src,scripts}/**/*.ts"
            run: pnpm exec oxlint --type-aware --fix {staged_files} && pnpm exec oxfmt {staged_files}
            stage_fixed: true

          # apps/renderer: .ts / .vue とも eslint で fix する。renderer の lint/fix SSOT は
          # eslint (package.json: lint=`eslint .` / fix=`eslint . -c eslint.config.fix.ts`)。
          # .ts を oxlint に回すと eslint 専用ルール (import-x/order 等) が .ts で抜け、
          # CI の fix:all (eslint 全ファイル) でのみ差分が出て「ローカルは通るが CI が落ちる」
          # ギャップになるため、CI と同じ eslint に揃える。oxfmt は全対象拡張子に適用。
          # 同一ファイルへの競合を避けるため piped で直列実行。
          # 親 group には glob を置かない: lefthook の group は親 glob と子 glob を
          # OR（和集合）で連結するため、親 glob は子を絞り込めず追加にしかならない。
          # 親 glob があると .md/.css 単独 commit でも eslint(.ts/.vue) が
          # 対象外ファイルを受け取り「No files found to lint」で落ちる。
          # 子ごとに glob を持たせて振り分けを完結させる。
          - name: renderer
            root: apps/renderer/
            group:
              piped: true
              jobs:
                - name: eslint
                  glob: "**/*.{ts,vue}"
                  # binary を直に呼ばず renderer の script 経由にする: eslint の宣言は
                  # renderer にあるが、knip の lefthook plugin は job の root を絶対パスに
                  # 解決しないため、binary 直呼びの参照は repo root 帰属になり未宣言扱いになる
                  run: pnpm run fix:staged {staged_files}
                  stage_fixed: true
                # oxfmt は対象拡張子を明示。glob 無しだと .json/.svg/.png まで
                # 受けて exit 2 で落ちるため {ts,vue,css,md} に限定する。
                - name: oxfmt
                  glob: "**/*.{ts,vue,css,md}"
                  run: pnpm exec oxfmt {staged_files}
                  stage_fixed: true
                # feature 間循環は増分で判定できない（グラフ全体の性質）ため全体走査で
                # 実行する。staged に .ts/.vue が無い commit では走らせない
                - name: feature-cycles
                  glob: "**/*.{ts,vue}"
                  run: bun scripts/checkFeatureCycles.ts

    # fix 系ジョブ完了後に実行（stage_fixed によるファイル書き換え後の状態で解析）
    # --fix で未使用 export を自動削除して stage に乗せる。
    # --allow-remove-files は付けない（ファイル削除は意図しない消失リスクがあるため、
    # export 単位の自動修正のみ許可）。--format で削除後のフォーマットも揃える。
    - name: knip
      run: pnpm knip --fix --format
      stage_fixed: true
