name: "Setup Environment"
description: "開発環境の共通セットアップ（mise、pnpm、依存関係）"

runs:
  using: "composite"
  steps:
    # mise によるランタイム環境のセットアップ
    # Node.js、Bun などのバージョン管理
    - name: Set up by mise
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      with:
        install: true
        cache: true

    # pnpm ストアディレクトリのパスを取得
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    # pnpm ストアのキャッシュ
    # node_modules の代わりにグローバルストアをキャッシュすることで
    # 重複を排除し、キャッシュサイズを削減
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

    # 依存関係のインストール
    # frozen-lockfile: lock ファイルを更新せず、正確なバージョンをインストール
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
