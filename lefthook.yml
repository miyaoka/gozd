# ** が0階層以上にマッチするようにする（デフォルトは1階層以上）
glob_matcher: doublestar

output:
  - execution_out

pre-commit:
  piped: true
  jobs:
    - name: checks-and-fixes
      group:
        parallel: true
        jobs:
          # 対象の package は CI の差分モードと同じ選び方（変更した package とその依存元）で
          # 選ぶ。基準を HEAD にするので、commit に入る変更を持つ package が必ず選ばれる
          - name: typecheck
            run: pnpm --filter "...[HEAD]" --if-present --no-bail --aggregate-output --reporter=append-only typecheck
          - name: test
            run: pnpm --filter "...[HEAD]" --if-present --no-bail --aggregate-output --reporter=append-only test

          - name: fmt
            glob: "**/*.{css,md}"
            run: bun fmt {staged_files}
            stage_fixed: true

          # renderer の eslint と bun lint は同じ .ts を書き換えるため、
          # eslint → bun lint → bun fmt の順で直列に走らせる。
          # この group と renderer の group には glob を置かない: lefthook の group は親 glob と
          # 子 glob を OR（和集合）で連結するため、親 glob は子を絞り込めず追加にしかならない。
          # 親 glob があると .md/.css 単独 commit でも eslint(.ts/.vue) が
          # 対象外ファイルを受け取り「No files found to lint」で落ちる。
          # 子ごとに glob を持たせて振り分けを完結させる。
          - name: linters
            group:
              piped: true
              jobs:
                - name: renderer
                  root: apps/renderer/
                  group:
                    piped: true
                    jobs:
                      - name: eslint
                        glob: "**/*.{ts,vue}"
                        # binary を直に呼ばず renderer の script 経由にする: eslint の宣言は
                        # renderer にあるが、knip の lefthook plugin は job の root を絶対パスに
                        # 解決しないため、binary 直呼びの参照は repo root 帰属になり未宣言扱いになる
                        run: pnpm run fix:staged {staged_files}
                        stage_fixed: true
                      - name: fmt
                        glob: "**/*.vue"
                        run: bun fmt {staged_files}
                        stage_fixed: true
                      # feature 間循環は増分で判定できない（グラフ全体の性質）ため全体走査で
                      # 実行する。staged に .ts/.vue が無い commit では走らせない
                      - name: feature-cycles
                        glob: "**/*.{ts,vue}"
                        run: bun scripts/checkFeatureCycles.ts

                # stage した .ts を workspace で分けずに 1 回の bun lint で検査・修正し、整形する
                - name: lint
                  glob: "**/*.ts"
                  run: bun lint --no-script --fix {staged_files} && bun fmt {staged_files}
                  stage_fixed: true

    # fix 系ジョブ完了後に実行（stage_fixed によるファイル書き換え後の状態で解析）
    # --fix で未使用 export を自動削除して stage に乗せる。
    # --allow-remove-files は付けない（ファイル削除は意図しない消失リスクがあるため、
    # export 単位の自動修正のみ許可）。--format で削除後のフォーマットも揃える。
    - name: knip
      run: pnpm knip --fix --format
      stage_fixed: true
