# コードバリデーションワークフロー
name: code_validation
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# PR trigger で third-party の依存を install して実行するため、job 内に write 権限のトークンを
# 置かない。repo 既定の継承に委ねると、設定が write に転じても workflow 側から観測できない
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # コードバリデーション（Matrix実行）
  #
  # PRで差分のあるパッケージとその依存先に限定してチェックする
  # ルート設定ファイル（pnpm-workspace.yaml, mise.toml）が変更された場合は
  # 全ワークスペースを対象にチェックする
  # ==============================================================
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ルートの集約スクリプトは 7 種あるが、matrix は fix を除いた 6 本。自動修正できる
          # 違反で PR を止めず、daily-fix workflow が日次の全件実行で返済する
          # （.github/workflows/daily-fix.yml）
          #
          # ${BASE_REF} はテンプレート展開ではなく、(diff) step の env を eval 時に展開する。
          # eval されるコマンド文字列にテンプレート式を埋め込まず、値は env で渡す
          #
          # diff_command に --include-workspace-root は要らない: 正のフィルタ（`--filter`）を
          # 与えると pnpm は root project を除外しないため、root 直下ファイルの変更でも root は
          # 選択される。逆に full_command 側の `pnpm -r`（*:all）はフィルタが無く root が
          # 除外されるため、そちらでは flag が必須（外すと root の test が静かに走らなくなる）
          - name: typecheck
            diff_command: pnpm --filter "...[origin/${BASE_REF}]" --if-present --no-bail --aggregate-output --reporter=append-only typecheck
            full_command: pnpm run typecheck:all

          - name: lint
            diff_command: pnpm --filter "...[origin/${BASE_REF}]" --if-present --no-bail --aggregate-output --reporter=append-only lint
            full_command: pnpm run lint:all

          - name: test
            diff_command: pnpm --filter "...[origin/${BASE_REF}]" --if-present --no-bail --aggregate-output --reporter=append-only test
            full_command: pnpm run test:all

          # 実ブラウザ (Chromium) で動かすテストは別レーンに置く。chromium という
          # 別ランタイムを要するのはこのレーンだけで、混ぜると取得が壊れた日に
          # unit test の信号まで巻き添えで止まり、切り分けもできなくなる
          - name: test:browser
            diff_command: pnpm --filter "...[origin/${BASE_REF}]" --if-present --no-bail --aggregate-output --reporter=append-only test:browser
            full_command: pnpm run test:browser:all

          # bundler だけが検査できる領域の gate。import 指定子の解決（`?worker` や
          # ambient `declare module` で型付けした deep import は typecheck から不可視で、
          # lint も no-unresolved を持たない）と、pnpm patch が named export を実際に
          # 復元できているか（Rolldown は ESM の欠落 named export を error にする）は
          # bundle しない限り分からない。これが無いと配布物が壊れる変更が全 job 緑で
          # 通り、merge 後の release build が最初の検知点になる
          - name: build
            diff_command: pnpm --filter "...[origin/${BASE_REF}]" --if-present --no-bail --aggregate-output --reporter=append-only build
            full_command: pnpm run build:all

          # knip は repo 全体を 1 単位で解析するため差分フィルタが無く、両モード同一。
          # pre-commit hook (--fix 付き) だけでは --no-verify で素通りするため gate を置く
          # （CI 側は --fix なしで検査のみ）
          - name: knip
            diff_command: pnpm run knip
            full_command: pnpm run knip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          show-progress: false

      - uses: $/.github/actions/setup-environment

      # ブラウザ実行レーン用: Playwright の chromium headless shell を入れる
      # ブラウザバイナリはキャッシュしない（Playwright 公式が非推奨: 復元時間が
      # ダウンロードと同程度で、Linux の OS 依存はそもそもキャッシュできないため）
      - name: Install Chromium headless shell
        if: matrix.name == 'test:browser'
        run: pnpm --filter @gozd/renderer run test:browser:setup

      # ルート設定ファイルの変更を検出
      # pnpm-workspace.yaml: catalog でバージョン管理、各 package.json は catalog: 参照のため差分が出ない
      # mise.toml: Node.js/pnpm/Bun バージョン
      # package.json: 集約スクリプト（*:all）の定義元。root には build / typecheck の script が
      # 無く差分モードでは --if-present で素通りするため、ここを触った PR は full_command に
      # 切り替えないと集約スクリプト自身の破損を検出できない（glob に ** を付けないので
      # apps/*/package.json は対象外。そちらは差分フィルタが当該パッケージを選ぶ）
      - uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        id: root-config
        with:
          files: |
            package.json
            pnpm-workspace.yaml
            mise.toml

      # ルート設定ファイルが変更された場合は全体チェック、それ以外は差分フィルタ
      - name: Run ${{ matrix.name }} (full)
        if: steps.root-config.outputs.any_changed == 'true'
        run: eval "$COMMAND"
        env:
          COMMAND: ${{ matrix.full_command }}

      - name: Run ${{ matrix.name }} (diff)
        if: steps.root-config.outputs.any_changed != 'true'
        run: eval "$COMMAND"
        env:
          COMMAND: ${{ matrix.diff_command }}
          BASE_REF: ${{ github.base_ref }} # COMMAND 内の ${BASE_REF} を eval 時に展開する

  # ==============================================================
  # workflow / composite action のセキュリティ検査
  #
  # 検査対象は CI 定義そのもので、CI で走ることが検査の目的になる。pre-commit には置かない
  #
  # advanced-security: false は SARIF 出力を止める。SARIF は finding があっても
  # exit 0 を返すため、有効にすると gate として働かない
  #
  # zizmor 本体のバージョンは action が持つ対応表が決める。version を渡すと Renovate が
  # それを Docker datasource として別に追い、action の対応表に載る前のバージョンへ
  # 上げる PR が立つ。action は対応表に無いバージョンを Unknown version で拒否する
  # ==============================================================
  workflow_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  # ==============================================================
  # CI全体のステータス集約
  # Branch Protectionルールでこのジョブのみを必須チェックに設定
  # これにより内部のジョブ構成を自由に変更可能
  # ==============================================================
  all-green:
    runs-on: ubuntu-latest
    if: always()
    needs:
      # gate を持たず常時実行されるため allowed-skips には含めない
      - workflow_audit
      - validation
    steps:
      - name: Check all CI jobs status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: validation
